今回のテーマは「あなたのアバター性格」です。<br><br><br>

①の「犬」を選んだあなたは、少し寂しがりや。<br>
無意識に足跡をつけすぎて、とんだ来客に驚くこともしばしば。<br><br>



気に入った相手のところだけに行くように努力すれば、相手の拒否リストに。<br><br><br>

②の「うさぎ」を選んだあなたは、キュートな魅力で異性にモテモテ。<br>
チャットルームを開けば千客万来、新しい服が出れば翌日にはプレゼントされる暮らし。<br><br>



同性から妬まれます。<br><br><br>

③の「雪だるま」を選んだあなたは、リーダー的存在。サークルを立ち上げちゃう兄貴肌。<br><br>



兄貴すぎてサブちゃんでいっぱい。<br>
