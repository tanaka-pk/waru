<b><font size=4>
未来では、今、レトロブーム。昔のなつかしい日本民謡が静かなブームなんだ。
<p>
＜収録＞<p>
昔なつかしい日本民謡を１万５０００曲収録。<br>
主に、コム口テツヤを収録、平成の歌姫、あむろなみゑは、全て収録。<p>
おじいさん、おばあさんへのプレゼントに喜ばれます。敬老の日にはぜひ。<br>
また、各、老人ホームへは、半額で配達しております。
